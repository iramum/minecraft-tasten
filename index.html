<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Клавиши для Майнкрафта</title>
<meta name="description" content="Тренажёр клавиш Minecraft Java для Mac с немецкой клавиатурой">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%238b5a2b'/><rect width='16' height='5' fill='%235fa83a'/><rect x='3' y='5' width='2' height='2' fill='%235fa83a'/><rect x='10' y='5' width='3' height='1' fill='%235fa83a'/></svg>">
<style>
:root{
  --bg:#e9f0e1;--panel:#ffffff;--panel2:#f4f7f0;--ink:#1d2618;--muted:#5a6852;--line:#cfd9c4;
  --keybg:#fbfbf9;--keyink:#23291f;--keyedge:#b9c1b1;
  --move:#3aa655;--act:#2f7fd8;--item:#e8961c;--view:#8e5bd6;--danger:#e0412f;
  --accent:#3aa655;--accentInk:#fff;--shadow:0 2px 0 rgba(0,0,0,.12),0 6px 18px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121810;--panel:#1c2419;--panel2:#232d20;--ink:#eef3e8;--muted:#a3b19a;--line:#34412f;
    --keybg:#2a3326;--keyink:#eef3e8;--keyedge:#10150e;
    --move:#4cc26a;--act:#4c97ee;--item:#f2a93a;--view:#a57bea;--danger:#f0604f;
    --accent:#4cc26a;--accentInk:#0c1a0b;--shadow:0 2px 0 rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#121810;--panel:#1c2419;--panel2:#232d20;--ink:#eef3e8;--muted:#a3b19a;--line:#34412f;
  --keybg:#2a3326;--keyink:#eef3e8;--keyedge:#10150e;
  --move:#4cc26a;--act:#4c97ee;--item:#f2a93a;--view:#a57bea;--danger:#f0604f;
  --accent:#4cc26a;--accentInk:#0c1a0b;--shadow:0 2px 0 rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 16px/1.4 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;overflow-x:hidden}
input{-webkit-user-select:text;user-select:text}
.wrap{max-width:1180px;margin:0 auto;padding:12px 16px 40px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.logo{width:44px;height:44px;border-radius:8px;image-rendering:pixelated;box-shadow:var(--shadow);flex:none}
h1{font-size:clamp(20px,3.2vw,30px);margin:0;letter-spacing:-.01em;font-weight:800}
.sub{color:var(--muted);font-size:14px;margin:0}
.hgrow{flex:1;min-width:200px}
.pill{display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:12px;box-shadow:var(--shadow)}
.pill button{border:0;background:transparent;color:var(--ink);font:inherit;font-weight:700;font-size:14px;line-height:1;padding:8px 10px;border-radius:8px;cursor:pointer}
.pill button.on{background:var(--accent);color:var(--accentInk)}
nav.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
nav.tabs button{flex:1 1 140px;border:0;border-radius:14px;padding:12px 14px;background:var(--panel);color:var(--ink);font:inherit;font-weight:800;font-size:18px;line-height:1.1;cursor:pointer;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:8px}
nav.tabs button.on{background:var(--accent);color:var(--accentInk)}
nav.tabs .em{font-size:24px}
.card{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:14px}
.hidden{display:none!important}

/* keyboard */
#kbdWrap{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:14px;align-items:start;margin-bottom:14px}
@media (max-width:820px){#kbdWrap{grid-template-columns:1fr}}
.kbd{background:var(--panel2);border-radius:14px;padding:clamp(4px,1vw,10px);box-shadow:var(--shadow)}
.row{display:flex;gap:clamp(2px,.45vw,5px);margin-bottom:clamp(2px,.45vw,5px)}
.row:last-child{margin-bottom:0}
.key{--g:var(--keyedge);position:relative;min-width:0;height:clamp(28px,5.2vw,58px);border-radius:clamp(4px,.7vw,8px);background:var(--keybg);color:var(--keyink);border:1px solid var(--keyedge);border-bottom-width:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:clamp(9px,1.5vw,17px);cursor:pointer;transition:transform .05s,background .1s;overflow:hidden}
.frow .key{height:clamp(20px,3.2vw,34px);font-size:clamp(8px,1.1vw,13px)}
.key .ke{font-size:clamp(8px,1.25vw,15px);line-height:1;margin-top:1px}
.key .kl{line-height:1;white-space:nowrap}
.key.small .kl{font-size:clamp(7px,1vw,12px);font-weight:700}
.key.g-move{--g:var(--move)}.key.g-act{--g:var(--act)}.key.g-item{--g:var(--item)}.key.g-view{--g:var(--view)}.key.g-danger{--g:var(--danger)}
.key[class*="g-"]{background:color-mix(in srgb,var(--g) 24%,var(--keybg));border-color:color-mix(in srgb,var(--g) 60%,var(--keyedge))}
.key.down{background:var(--g);color:#fff;transform:translateY(2px);border-bottom-width:1px}
.key:not([class*="g-"]).down{background:var(--muted)}
.key.hint{animation:pulse 1s ease-in-out infinite;z-index:1}
.key.enterTop{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom-width:0;margin-bottom:calc(-1 * clamp(2px,.45vw,5px));height:calc(clamp(28px,5.2vw,58px) + clamp(2px,.45vw,5px))}
.key.enterBot{border-top-left-radius:0;border-top-right-radius:0;border-top-width:0}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--g) 0%,transparent)}50%{box-shadow:0 0 0 4px var(--g)}}
.arrows{display:flex;gap:clamp(2px,.45vw,5px);min-width:0}
.arrows .key{flex:1 1 0}
.ud{flex:1 1 0;display:flex;flex-direction:column;gap:2px;min-width:0}
.ud .key{height:calc((clamp(28px,5.2vw,58px) - 2px)/2);font-size:clamp(7px,1vw,11px);border-bottom-width:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}

/* mouse */
.mouseBox{display:flex;flex-direction:column;gap:8px;align-items:center}
#mouseSvg{width:100%;max-width:150px;height:auto}
#mouseSvg .mb{fill:var(--keybg);stroke:var(--keyedge);stroke-width:3;cursor:pointer;transition:fill .1s}
#mouseSvg .mb.l{fill:color-mix(in srgb,var(--act) 24%,var(--keybg))}
#mouseSvg .mb.r{fill:color-mix(in srgb,var(--item) 30%,var(--keybg))}
#mouseSvg .mb.w{fill:color-mix(in srgb,var(--view) 30%,var(--keybg))}
#mouseSvg .mb.down.l{fill:var(--act)}#mouseSvg .mb.down.r{fill:var(--item)}#mouseSvg .mb.down.w{fill:var(--view)}
#mouseSvg .mb.hint{animation:mpulse 1s infinite}
@keyframes mpulse{50%{stroke:var(--danger);stroke-width:6}}
#mouseSvg text{font:800 20px system-ui;fill:var(--keyink);pointer-events:none}
.pad{width:100%;aspect-ratio:1/1;max-width:170px;border-radius:10px;background-size:100% 100%;image-rendering:pixelated;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25),var(--shadow);position:relative;cursor:crosshair;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.pad .padtxt{background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:700;padding:4px 6px;border-radius:6px;margin:6px;text-align:center}
.pad .crack{position:absolute;inset:0;background:rgba(0,0,0,.0);pointer-events:none}
.pad.hint{outline:4px solid var(--danger);outline-offset:3px;animation:padp 1s infinite}
@keyframes padp{50%{outline-color:transparent}}

/* explore */
#info{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;min-height:120px}
@media (max-width:600px){#info{grid-template-columns:1fr}}
.bigkey{min-width:110px;height:110px;padding:0 18px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;background:color-mix(in srgb,var(--g,var(--muted)) 26%,var(--keybg));border:2px solid var(--g,var(--keyedge));border-bottom-width:7px;color:var(--keyink)}
.infoTitle{font-size:clamp(22px,3.4vw,34px);font-weight:900;line-height:1.15}
.infoNote{color:var(--muted);font-size:16px;margin-top:6px}
.emoBig{font-size:64px;line-height:1}
.say{border:0;background:var(--panel2);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:22px;cursor:pointer;box-shadow:var(--shadow)}

/* lessons */
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.lvl{border:0;border-radius:14px;padding:12px;background:var(--panel);color:var(--ink);font:inherit;font-weight:800;font-size:16px;line-height:1.2;cursor:pointer;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;text-align:left}
.lvl .em{font-size:30px}
.lvl.on{outline:3px solid var(--accent)}
.lvl .stars{font-size:13px;color:var(--muted);font-weight:700;display:block}
#task{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
@media (max-width:600px){#task{grid-template-columns:1fr}}
.taskEmo{font-size:70px;line-height:1}
.taskTxt{font-size:clamp(22px,3.4vw,34px);font-weight:900;line-height:1.15}
.taskSub{color:var(--muted);margin-top:6px;min-height:22px;font-size:16px}
.dots{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.dots i{width:18px;height:18px;border-radius:4px;background:var(--line);display:block}
.dots i.ok{background:var(--accent)}
.dots i.cur{outline:2px solid var(--accent);outline-offset:1px}
.bar{height:12px;border-radius:6px;background:var(--line);margin-top:10px;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:var(--accent);border-radius:6px}
.tbtns{display:flex;flex-direction:column;gap:8px}
.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--panel2);color:var(--ink);font:inherit;font-weight:800;font-size:16px;line-height:1;cursor:pointer;box-shadow:var(--shadow)}
.btn.main{background:var(--accent);color:var(--accentInk)}
.praise{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);font-size:clamp(40px,8vw,90px);font-weight:900;color:#fff;text-shadow:0 4px 0 #2b6b1d,0 0 30px rgba(0,0,0,.35);pointer-events:none;opacity:0;transition:all .25s;z-index:50;white-space:nowrap}
.praise.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.done{text-align:center;padding:10px}
.done .big{font-size:60px}
.done h2{margin:6px 0 12px;font-size:30px}

/* world */
#worldBox{position:relative;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);background:#1b3a8a}
#cv{display:block;width:100%;cursor:crosshair;touch-action:none}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:5}
.ovc{background:#c6c6c6;color:#222;border:4px solid #fff;border-right-color:#555;border-bottom-color:#555;border-radius:4px;padding:14px;max-width:92%;max-height:92%;overflow:auto}
.ovc h3{margin:0 0 10px;font-size:20px}
.ovc .btn{background:#8b8b8b;color:#fff;border-radius:4px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35);display:block;width:100%;margin-top:8px;text-align:center}
.slots{display:grid;grid-template-columns:repeat(9,44px);gap:3px}
.slot{width:44px;height:44px;background:#8b8b8b;border:2px solid #373737;border-right-color:#fff;border-bottom-color:#fff;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center}
.slot img{width:32px;height:32px;image-rendering:pixelated;pointer-events:none}
.slot b{position:absolute;right:2px;bottom:0;color:#fff;font-size:13px;text-shadow:1px 1px 0 #3f3f3f;pointer-events:none}
.slot.sel{outline:3px solid #fff;outline-offset:-3px;background:#a0a0a0}
.slot.pick{outline:3px solid #ffd23d;outline-offset:-3px}
.slot .num{position:absolute;left:2px;top:0;color:#444;font-size:10px;font-weight:800;text-shadow:none}
.invRow{display:flex;gap:10px;align-items:flex-end;margin-top:10px}
.invLbl{font-size:13px;color:#444;margin:10px 0 4px;font-weight:700}
#chatBar{position:absolute;left:8px;right:8px;bottom:8px;z-index:6;display:flex;gap:6px}
#chatIn{flex:1;background:rgba(0,0,0,.6);color:#fff;border:2px solid #aaa;border-radius:4px;padding:8px 10px;font:600 16px ui-monospace,Menlo,monospace;outline:none}
.adv{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.adv div{background:#8b8b8b;color:#fff;padding:8px;border-radius:3px;display:flex;gap:8px;align-items:center;font-size:14px}
.adv div.got{background:#4c8a3a}
.adv div span{font-size:24px}
.adv div small{display:block;opacity:.85;font-size:12px}
.wlegend{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;margin-top:12px}
.wl{display:flex;gap:8px;align-items:center;background:var(--panel);border-radius:10px;padding:6px 8px;box-shadow:var(--shadow);font-size:14px}
.wl kbd{font:800 13px ui-rounded,system-ui;background:color-mix(in srgb,var(--g) 26%,var(--keybg));border:1px solid var(--g);border-bottom-width:3px;border-radius:6px;padding:3px 6px;white-space:nowrap;color:var(--keyink)}
.wl.lit{outline:3px solid var(--g)}
#lastKey{margin-top:10px;font-size:18px;font-weight:800;min-height:28px}
.touchNote{background:var(--panel);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}

/* parents */
.tips{display:grid;gap:10px}
.tip{background:var(--panel);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start}
.tip .ti{font-size:28px;line-height:1}
.tip h3{margin:0 0 4px;font-size:18px}
.tip p{margin:0;color:var(--ink);font-size:15px;line-height:1.5}
.tip kbd{font:800 13px ui-rounded,system-ui;background:var(--keybg);border:1px solid var(--keyedge);border-bottom-width:3px;border-radius:6px;padding:1px 6px;white-space:nowrap}
.nameRow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.nameRow input{font:inherit;font-weight:700;font-size:16px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink)}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <canvas class="logo" id="logo" width="16" height="16"></canvas>
    <div class="hgrow">
      <h1 data-i="title"></h1>
      <p class="sub" data-i="sub"></p>
    </div>
    <div class="pill" id="langs">
      <button data-l="ru">RU</button><button data-l="de">DE</button><button data-l="en">EN</button>
    </div>
    <div class="pill"><button id="soundBtn"></button></div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-t="explore"><span class="em">🔍</span><span data-i="tExplore"></span></button>
    <button data-t="lessons"><span class="em">⭐</span><span data-i="tLessons"></span></button>
    <button data-t="world"><span class="em">🌍</span><span data-i="tWorld"></span></button>
    <button data-t="parents"><span class="em">👩‍👧</span><span data-i="tParents"></span></button>
  </nav>

  <!-- shared keyboard + mouse -->
  <section id="kbdWrap">
    <div>
      <div class="kbd" id="kbd"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="card mouseBox">
      <svg id="mouseSvg" viewBox="0 0 120 190" aria-label="mouse">
        <path class="mb l" data-m="0" d="M58 10 C30 10 12 30 12 62 L12 80 L58 80 Z"/>
        <path class="mb r" data-m="2" d="M62 10 C90 10 108 30 108 62 L108 80 L62 80 Z"/>
        <path class="mb" data-m="body" d="M12 84 L108 84 L108 130 C108 162 88 182 60 182 C32 182 12 162 12 130 Z" style="cursor:default"/>
        <rect class="mb w" data-m="1" x="50" y="24" width="20" height="40" rx="10"/>
        <text x="28" y="56">L</text><text x="80" y="56">R</text>
      </svg>
      <div class="pad" id="pad"><div class="crack" id="crack"></div><div class="padtxt" data-i="padHint"></div></div>
    </div>
  </section>

  <!-- explore -->
  <section id="p-explore" class="panel">
    <div class="card" id="info"></div>
  </section>

  <!-- lessons -->
  <section id="p-lessons" class="panel">
    <div class="levels" id="levels"></div>
    <div class="card" id="taskCard"></div>
  </section>

  <!-- world -->
  <section id="p-world" class="panel">
    <div class="touchNote hidden" id="touchNote" data-i="touchNote"></div>
    <div id="worldBox">
      <canvas id="cv"></canvas>
      <div class="ov hidden" id="ovPause"><div class="ovc">
        <h3 data-i="paused"></h3>
        <button class="btn" id="bResume" data-i="resume"></button>
        <button class="btn" id="bNew" data-i="newWorld"></button>
        <button class="btn" id="bGm"></button>
      </div></div>
      <div class="ov hidden" id="ovInv"><div class="ovc">
        <h3 data-i="invTitle"></h3>
        <div class="invLbl" data-i="invMain"></div>
        <div class="slots" id="invMain"></div>
        <div class="invLbl" data-i="invHot"></div>
        <div class="invRow"><div class="slots" id="invHot"></div>
          <div><div class="invLbl" data-i="offhand" style="margin-top:0"></div><div class="slot" id="invOff"></div></div></div>
        <div class="invLbl" data-i="invHelp" style="font-weight:600"></div>
      </div></div>
      <div class="ov hidden" id="ovAdv"><div class="ovc" style="min-width:min(640px,92%)">
        <h3 data-i="advTitle"></h3><div class="adv" id="advList"></div>
        <button class="btn" id="bAdvClose" data-i="close"></button>
      </div></div>
      <div class="ov hidden" id="ovPlayers" style="background:transparent;align-items:flex-start;padding-top:20px"><div class="ovc" id="playersList" style="background:rgba(0,0,0,.6);color:#fff;border-color:#888"></div></div>
      <div id="chatBar" class="hidden"><input id="chatIn" maxlength="100" autocomplete="off" spellcheck="false"></div>
    </div>
    <div id="lastKey"></div>
    <div class="wlegend" id="wlegend"></div>
  </section>

  <!-- parents -->
  <section id="p-parents" class="panel">
    <div class="tips" id="tips"></div>
  </section>

  <footer data-i="foot"></footer>
</div>
<div class="praise" id="praise"></div>

<script>
"use strict";
/* ---------- storage (never required) ---------- */
const store={get(k,d){try{const v=localStorage.getItem('mct_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('mct_'+k,JSON.stringify(v))}catch(e){}}};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let LANG=store.get('lang','ru'); if(!['ru','de','en'].includes(LANG)) LANG='ru';
let SOUND=store.get('sound',true);
let TAB=store.get('tab','explore');

/* ---------- texts ---------- */
const UI={
ru:{title:'Клавиши для Майнкрафта',sub:'Тренировка на Mac · немецкая клавиатура · мышка',tExplore:'Изучаем',tLessons:'Задания',tWorld:'Мир',tParents:'Для взрослых',
padHint:'мышка — сюда',pressAny:'Нажми любую клавишу',pressAnySub:'или кнопку мышки на блоке травы справа. Я скажу, что она делает в Майнкрафте.',
notUsed:'В Майнкрафте эта клавиша не нужна',fnNote:'На Mac F-клавиши нажимаются вместе с fn',slashNote:'Напечатать «/» в чате: Shift + 7',
dangerNote:'⌘ + Q сразу закроет игру. ⌘ + W закроет эту страницу.',ctrlNote:'Бегать можно и так: быстро нажми W два раза и держи.',
legend:{move:'ходить',act:'действия',item:'предметы',view:'экран и меню',danger:'опасно'},
sound:'Звук',skip:'Пропустить',again:'Ещё раз',next:'Следующий уровень',chooseLevel:'Выбери уровень сверху',

/* ---------- sound & voice ---------- */
let AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)() }catch(e){ AC=null } } if(AC&&AC.state==='suspended') AC.resume(); return AC }
function beep(f=440,d=.08,type='square',vol=.05,slide=0){ if(!SOUND) return; const a=ac(); if(!a) return; const o=a.createOscillator(),g=a.createGain(),t=a.currentTime; o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f*slide),t+d); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(a.destination); o.start(t); o.stop(t+d+.02) }
function noise(d=.12,vol=.08,freq=900){ if(!SOUND) return; const a=ac(); if(!a) return; const len=Math.floor(a.sampleRate*d), b=a.createBuffer(1,len,a.sampleRate), ch=b.getChannelData(0); for(let i=0;i<len;i++) ch[i]=(Math.random()*2-1)*(1-i/len); const s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain(); s.buffer=b; f.type='bandpass'; f.frequency.value=freq; g.gain.value=vol; s.connect(f).connect(g).connect(a.destination); s.start() }
const SFX={
 ok(){[523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,.13,'triangle',.08),i*90))},

 jump(){beep(320,.1,'sine',.04,1.8)}, eat(){for(let i=0;i<3;i++) setTimeout(()=>noise(.06,.07,1500),i*130)},

};
let voices=[];
function loadVoices(){ try{ voices=speechSynthesis.getVoices() }catch(e){} }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices }
function speak(text){
 if(!SOUND||!('speechSynthesis' in window)||!text) return;
 try{
  speechSynthesis.cancel();
  const clean=text.replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}\u{20E3}⌘⌃⌥⇧⇥⇪↩⌫]/gu,'').replace(/«|»|„|“|”/g,'');
  const u=new SpeechSynthesisUtterance(clean); const lc={ru:'ru-RU',de:'de-DE',en:'en-US'}[LANG]; u.lang=lc; u.rate=.95;
  const v=voices.find(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith(lc.slice(0,2))); if(v) u.voice=v;
  setTimeout(()=>{ try{ speechSynthesis.speak(u) }catch(e){} },40);
 }catch(e){}
}

mk('stone',14,(x,r)=>{speck(x,r,'#8b8b8b',['#7a7a7a','#9b9b9b','#6e6e6e'],90);x.fillStyle='#6a6a6a';x.fillRect(3,5,4,1);x.fillRect(10,11,3,1);x.fillRect(9,2,1,2)});
mk('cobble',15,(x,r)=>{x.fillStyle='#595959';x.fillRect(0,0,16,16);const b=[[0,0,6,5],[7,0,9,4],[0,6,4,5],[5,5,6,6],[12,5,4,5],[0,12,7,4],[8,12,8,4],[12,11,4,1]];b.forEach(q=>{const g=110+((r()*40)|0);x.fillStyle=`rgb(${g},${g},${g})`;x.fillRect(q[0],q[1],q[2]-1,q[3]-1);x.fillStyle='rgba(255,255,255,.18)';x.fillRect(q[0],q[1],q[2]-1,1)})});

mk('glass',19,(x,r)=>{x.fillStyle='rgba(200,235,250,.45)';x.fillRect(0,0,16,16);x.strokeStyle='#eefaff';x.lineWidth=1;x.strokeRect(.5,.5,15,15);x.fillStyle='rgba(255,255,255,.8)';x.fillRect(3,3,1,1);x.fillRect(4,4,1,1);x.fillRect(5,5,1,1);x.fillRect(10,3,1,1)});
mk('flower',20,(x,r)=>{x.drawImage(TEX.grass,0,0);x.fillStyle='#2f7a22';x.fillRect(7,8,1,5);x.fillStyle='#e0412f';[[6,5],[8,5],[5,6],[9,6],[6,7],[8,7],[7,4]].forEach(([a,b])=>x.fillRect(a,b,1,1));x.fillStyle='#f5d63d';x.fillRect(7,6,1,1)});

/* ---------- build keyboard ---------- */
function buildKeyboard(){
 const kb=$('#kbd'); kb.innerHTML='';
 ROWS.forEach((row,ri)=>{
  const r=document.createElement('div'); r.className='row'+(ri===0?' frow':'');
  row.forEach(k=>{
   if(k[0]==='ARROWS'){
    const a=document.createElement('div'); a.className='arrows'; a.style.flex=`${k[2]} 1 0`;
    a.append(keyEl('ArrowLeft','←',1)); const ud=document.createElement('div'); ud.className='ud'; ud.append(keyEl('ArrowUp','↑',1),keyEl('ArrowDown','↓',1)); a.append(ud); a.append(keyEl('ArrowRight','→',1)); r.append(a); return;
   }
   r.append(keyEl(k[0],k[1],k[2]||1,k[3]));
  });
  kb.append(r);
 });
}
function keyEl(code,label,w,extra){
 const d=document.createElement('div'); d.className='key'+(extra?' '+extra:''); d.dataset.code=code; d.style.flex=`${w} 1 0`;
 const a=ACT[code]; if(a) d.classList.add('g-'+a.grp);
 if(label.length>3) d.classList.add('small');
 d.innerHTML=`<span class="kl">${label}</span>`+(a&&code!=='Enter'&&!(extra==='enterBot')?`<span class="ke">${a.emo}</span>`:'');
 if(code==='Enter'&&extra==='enterBot'&&a) d.innerHTML=`<span class="ke">${a.emo}</span>`;
 return d;
}
const keyEls=code=>$$(`#kbd [data-code="${code}"]`);
function keyVis(code,on){ keyEls(code).forEach(e=>e.classList.toggle('down',on)) }

function showInfo(code){

 let note='';
 if(/^F\d+$/.test(code)) note=U().fnNote;

 $('#info').innerHTML=`<div class="bigkey" style="--g:${g}">${label}</div><div><div class="infoTitle">${a?`${a.emo} ${tr(a.txt)}`:U().notUsed}</div>${note?`<div class="infoNote">${note}</div>`:''}</div><button class="say" title="🔊">🔊</button>`;
 const say=(a?tr(a.txt):U().notUsed)+(note&&code!=='ControlLeft'?'. '+note:'');

 speak(say);
}

function clearHints(){ $$('.hint').forEach(e=>e.classList.remove('hint')) }
function curTask(){ return LESSONS[L.li].tasks[L.ti] }
function renderTask(say=true){
 clearHints(); L.hold=0; L.wheel=0; L.lock=false; L.wArmed=false;
 const les=LESSONS[L.li];
 if(L.finished){ return renderDone() }
 const t=curTask();
 const dots=les.tasks.map((_,i)=>`<i class="${i<L.ti?'ok':''}${i===L.ti?' cur':''}"></i>`).join('');
 const needBar=t.t==='hold'||t.t==='mhold';
 const sub=t.sub?tr(t.sub):(needBar?U().holdHint:(t.fn?U().fnNote:''));
 $('#taskCard').innerHTML=`<div id="task"><div class="taskEmo">${t.emo||les.emo}</div><div><div class="taskTxt">${tr(t.txt)}</div><div class="taskSub" id="tsub">${sub}</div>${needBar?'<div class="bar"><b id="hbar"></b></div>':''}<div class="dots">${dots}</div></div><div class="tbtns"><button class="say" id="tsay">🔊</button><button class="btn" id="tskip">${U().skip}</button></div></div>`;
 $('#tsay').onclick=()=>speak(tr(t.txt)); $('#tskip').onclick=()=>taskDone(true);
 if(t.t!=='pick'){ (t.codes||[]).forEach(c=>keyEls(c).forEach(e=>e.classList.add('hint'))) }
 if(t.t==='mouse'||t.t==='mhold'){ $(`#mouseSvg [data-m="${t.btn}"]`).classList.add('hint'); $('#pad').classList.add('hint') }
 if(t.t==='wheel'){ $('#mouseSvg [data-m="1"]').classList.add('hint'); $('#pad').classList.add('hint') }
 if(say) speak(tr(t.txt));
}
function renderDone(){
 const last=L.li>=LESSONS.length-1, all=LESSONS.every(l=>prog[l.id]);
 $('#taskCard').innerHTML=`<div class="done"><div class="big">🏆</div><h2>${all?U().allDone:U().levelDone}</h2><button class="btn" id="dAgain">${U().again}</button> ${last?`<button class="btn main" id="dWorld">${U().toWorld}</button>`:`<button class="btn main" id="dNext">${U().next}</button>`}</div>`;
 $('#dAgain').onclick=()=>{L.ti=0;L.finished=false;renderTask(true)};
 if($('#dNext')) $('#dNext').onclick=()=>{L.li++;store.set('li',L.li);L.ti=0;L.finished=false;renderLevels();renderTask(true)};
 if($('#dWorld')) $('#dWorld').onclick=()=>setTab('world');
}
function praise(){ const p=$('#praise'); const arr=U().praise; p.textContent=arr[(Math.random()*arr.length)|0]+' ⭐'; p.classList.add('show'); clearTimeout(p._t); p._t=setTimeout(()=>p.classList.remove('show'),800) }
function taskDone(skipped){
 if(L.lock||L.finished) return; L.lock=true;
 if(!skipped){ SFX.ok(); praise() }
 const les=LESSONS[L.li];
 setTimeout(()=>{
  L.ti++;
  if(L.ti>=les.tasks.length){ prog[les.id]=true; store.set('prog',prog); L.finished=true; SFX.win(); renderLevels(); renderDone(); speak(U().levelDone) }
  else renderTask(true);
 },skipped?50:850);
}
function wrongHint(label,act){ const s=$('#tsub'); if(!s) return; s.textContent=U().wrong(label,act); SFX.wrong() }
function lessonKey(code,first){
 if(L.finished||L.lock) return; const t=curTask();
 if(t.t==='key'&&first){ if(t.codes.includes(code)) return taskDone(); const a=ACT[code]; return wrongHint(keyName(code),a?tr(a.txt):'') }
 if(t.t==='sprintjump'){
  if(code==='KeyW'&&first){ const now=performance.now(); if(now-L.lastW<400) L.wArmed=true; L.lastW=now }
  if(code==='Space'&&first&&down.has('KeyW')&&(L.wArmed||down.has('ControlLeft'))) taskDone();
 }
}
function lessonTick(dt){
 if(TAB!=='lessons'||L.finished||L.lock) return; const t=curTask(); let ok=false;
 if(t.t==='hold') ok=t.codes.every(c=>down.has(c));
 else if(t.t==='mhold') ok=padDown[0];
 else return;
 L.hold=ok?L.hold+dt*1000:0;
 const b=$('#hbar'); if(b) b.style.width=Math.min(100,L.hold/t.ms*100)+'%';
 if(t.t==='mhold') $('#crack').style.background=`rgba(0,0,0,${Math.min(.6,L.hold/t.ms*.6)})`;
 if(L.hold>=t.ms){ if(t.t==='mhold'){ SFX.brk(); $('#crack').style.background='rgba(0,0,0,0)' } taskDone() }
}
$('#kbd').addEventListener('click',e=>{
 const k=e.target.closest('.key'); if(!k) return; const code=k.dataset.code;
 if(TAB==='explore'){ showInfo(code); keyVis(code,true); setTimeout(()=>keyVis(code,false),200) }
 if(TAB==='lessons'&&!L.finished&&!L.lock){ const t=curTask(); if(t.t==='pick'){ if(t.codes.includes(code)) taskDone(); else { const a=ACT[code]; wrongHint(keyName(code),a?tr(a.txt):'') } } }
});

/* ---------- global keys ---------- */
const down=new Set();
function releaseAll(){ down.forEach(c=>keyVis(c,false)); down.clear(); if(G){ G.mb={0:false,1:false,2:false}; hidePlayers() } }
window.addEventListener('blur',releaseAll);
document.addEventListener('keydown',e=>{
 if(e.target===$('#chatIn')) return;
 if(e.target.tagName==='INPUT') return;
 ac();
 const code=e.code||'';
 if(e.metaKey){ // let macOS/browser shortcuts through
  if(code.startsWith('Meta')){ down.add(code); keyVis(code,true); if(TAB==='explore') showInfo(code) }
  return;
 }
 if(TAB!=='parents') e.preventDefault();
 const first=!down.has(code); down.add(code); keyVis(code,true);
 if(TAB==='explore'&&first) showInfo(code);
 else if(TAB==='lessons') lessonKey(code,first);
 else if(TAB==='world') worldKey(e,code,first);
});
document.addEventListener('keyup',e=>{
 const code=e.code||'';
 down.delete(code); keyVis(code,false);
 if(code.startsWith('Meta')) releaseAll(); // macOS drops keyups while ⌘ is held
 if(code==='KeyW'){ L.wArmed=false; if(G) G.wSprint=false }
 if(code==='Tab') hidePlayers();
});

function valueNoise(r,C,R,scale){
 const gw=Math.ceil(C/scale)+2, gh=Math.ceil(R/scale)+2, g=[]; for(let i=0;i<gw*gh;i++) g.push(r());
 const s=t=>t*t*(3-2*t);
 return (x,y)=>{ const fx=x/scale, fy=y/scale, ix=Math.floor(fx), iy=Math.floor(fy), u=s(fx-ix), v=s(fy-iy);
  const a=g[iy*gw+ix], b=g[iy*gw+ix+1], c=g[(iy+1)*gw+ix], d=g[(iy+1)*gw+ix+1];
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v };
}
function genWorld(seed){
 const r=rng(seed), C=64, R=44, g=new Array(C*R);
 const nW=valueNoise(r,C,R,8), nS=valueNoise(r,C,R,7);
 for(let y=0;y<R;y++) for(let x=0;x<C;x++){ const w=nW(x,y), s=nS(x,y); g[y*C+x]= w<.3?'water': s>.7?'stone':'grass' }
 const at=(x,y)=>(x<0||y<0||x>=C||y>=R)?null:g[y*C+x];
 const g2=g.slice();
 for(let y=0;y<R;y++) for(let x=0;x<C;x++){ if(g[y*C+x]!=='grass') continue; let wet=false; for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++) if(at(x+dx,y+dy)==='water') wet=true; if(wet) g2[y*C+x]='sand' }
 for(let i=0;i<g.length;i++) g[i]=g2[i];
 for(let y=1;y<R-1;y++) for(let x=1;x<C-1;x++){
  if(r()<.03){ let ok=true; for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++) if(at(x+dx,y+dy)!=='grass') ok=false;
   if(ok){ for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++) if((dx||dy)&&r()<.8) g[(y+dy)*C+x+dx]='leaves'; g[y*C+x]='log' } }
 }
 for(let i=0;i<g.length;i++) if(g[i]==='grass'&&r()<.04) g[i]='flower';
 const sx=C>>1, sy=R>>1;
 for(let dy=-3;dy<=3;dy++) for(let dx=-3;dx<=3;dx++) g[(sy+dy)*C+sx+dx]='grass';
 // guarantee a pond and a tree near spawn for the first lessons
 for(let dy=0;dy<3;dy++) for(let dx=0;dx<4;dx++) g[(sy+5+dy)*C+sx+3+dx]='water';
 for(let dx=-1;dx<=4;dx++){ if(g[(sy+4)*C+sx+3+dx]!=='water') g[(sy+4)*C+sx+3+dx]='sand' }
 g[(sy-5)*C+sx-4]='log'; [[-1,0],[1,0],[0,-1],[0,1],[-1,-1],[1,1]].forEach(([dx,dy])=>g[(sy-5+dy)*C+sx-4+dx]='leaves');
 return {C,R,g,spawn:{x:sx+.5,y:sy+.5}};
}
function newGame(){
 const w=genWorld((Date.now()%1e6)|0);
 G={...w,p:{x:w.spawn.x,y:w.spawn.y,face:{x:0,y:1},jumpT:0,sneak:false,sprint:false,inWater:false,walkT:0},
  hot:[{i:'planks',n:16},{i:'cobble',n:16},{i:'glass',n:8},{i:'flower',n:4},{i:'apple',n:3},null,null,null,null],
  inv:Array(27).fill(null),off:null,sel:0,hunger:17,hTimer:0,creative:false,night:false,rain:false,hud:true,debug:false,zoomI:0,
  drops:[],parts:[],rainP:[],mine:{idx:-1,prog:0,tick:0},placeCD:0,overlay:null,mb:{0:false,1:false,2:false},mouse:null,
  stats:{placed:0,logs:0,jumps:0,run:0},adv:store.get('adv',{}),msgs:[],toasts:[],flash:0,nameT:0,lastWTap:0,wSprint:false,invPick:null,time:0};
 G.inv[0]={i:'log',n:8};G.inv[1]={i:'sand',n:16};G.inv[2]={i:'leaves',n:8};G.inv[3]={i:'apple',n:5};
 closeOverlays(); $('#bGm').textContent=U().gmS;
 msg(U().worldIntro,'#ffe066');
}
function ensureGame(){ if(!G) newGame() }
function fitCanvas(){
 const box=$('#worldBox'); if(!box.offsetWidth) return;
 DPR=Math.min(2,window.devicePixelRatio||1); CW=box.clientWidth; CH=Math.round(Math.max(320,Math.min(620,window.innerHeight-230)));
 cv.style.height=CH+'px'; cv.width=Math.round(CW*DPR); cv.height=Math.round(CH*DPR);
}
window.addEventListener('resize',()=>{ if(TAB==='world') fitCanvas() });

const cellAt=(x,y)=>{ const tx=Math.floor(x), ty=Math.floor(y); if(tx<0||ty<0||tx>=G.C||ty>=G.R) return null; return G.g[ty*G.C+tx] };
function canBe(x,y){ const h=.3; for(const [cx,cy] of [[x-h,y-h],[x+h,y-h],[x-h,y+h],[x+h,y+h]]){ const t=cellAt(cx,cy); if(!t||!WALK[t]) return false } return true }
function zoom(){ return [1,.62,1.45][G.zoomI] }
function T(){ return 34*zoom() }
function target(){
 if(!G.mouse) return null; const t=T();
 const wx=G.p.x+(G.mouse.x-CW/2)/t, wy=G.p.y+(G.mouse.y-CH/2)/t;
 const tx=Math.floor(wx), ty=Math.floor(wy); if(tx<0||ty<0||tx>=G.C||ty>=G.R) return null;
 const d=Math.hypot(tx+.5-G.p.x,ty+.5-G.p.y);
 return {tx,ty,idx:ty*G.C+tx,t:G.g[ty*G.C+tx],reach:d<=4.6};
}
function msg(text,col){ G.msgs.push({text,col:col||'#fff',t:performance.now()}); if(G.msgs.length>30) G.msgs.shift() }
function toast(title,sub,icon){ G.toasts.push({title,sub,icon,t:3.2}) }
function unlock(id){
 if(!G||G.adv[id]) return; G.adv[id]=true; store.set('adv',G.adv);
 const a=ADV.find(a=>a[0]===id); if(!a) return; toast(U().advGot,tr(a[2]),a[1]); SFX.win();
}
function give(item,n){
 const lists=[G.hot,G.inv];
 for(const L of lists) for(const s of L) if(s&&s.i===item&&s.n<64){ const k=Math.min(64-s.n,n); s.n+=k; n-=k; if(!n) return true }
 for(const L of lists) for(let i=0;i<L.length;i++) if(!L[i]){ L[i]={i:item,n:Math.min(64,n)}; n-=Math.min(64,n); if(!n) return true }
 toast(U().full,'','🎒'); return false;
}
function selItem(){ return G.hot[G.sel] }
function selectSlot(i){ G.sel=(i+9)%9; G.nameT=1.8; SFX.click() }
function breakCell(tg){
 const t=tg.t, drop=DROP[t];
 G.g[tg.idx]=AFTER[t]; SFX.brk();
 const col={stone:'#8b8b8b',cobble:'#777',log:'#8f6533',planks:'#b48648',leaves:'#3d8b2a',glass:'#cfe9f5',flower:'#e0412f',sand:'#dccf8f'}[t]||'#999';
 for(let i=0;i<10;i++) G.parts.push({x:tg.tx+.5,y:tg.ty+.5,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:.5+Math.random()*.3,col});
 if(!G.creative){ if(drop) give(drop,1); if(t==='leaves'&&Math.random()<.2){ give('apple',1); SFX.pop() } }
 if(t==='log'){ G.stats.logs++; if(G.stats.logs>=5) unlock('wood') }
 unlock('first');
}
function placeBlock(){
 const s=selItem(); if(!s) return;
 if(s.i==='apple'){ if(G.hunger<20||G.creative){ G.hunger=Math.min(20,G.hunger+4); if(!G.creative){ s.n--; if(!s.n) G.hot[G.sel]=null } SFX.eat(); unlock('eat') } return }
 const tg=target(); if(!tg||!tg.reach) return;
 if(!['grass','sand','dirt','water'].includes(tg.t)) return;
 if(s.i==='flower'&&tg.t==='water') return;
 if(Math.abs(G.p.x-(tg.tx+.5))<.8&&Math.abs(G.p.y-(tg.ty+.5))<.8) return;
 if(tg.t==='water') unlock('bridge');
 G.g[tg.idx]=PLACE[s.i]; SFX.place();
 if(!G.creative){ s.n--; if(!s.n) G.hot[G.sel]=null }
 G.stats.placed++; if(G.stats.placed>=10) unlock('build');
}
function pickBlock(){
 const tg=target(); if(!tg) return; const it=PICK[tg.t]; if(!it) return;
 const i=G.hot.findIndex(s=>s&&s.i===it);
 if(i>=0){ selectSlot(i); return }
 if(G.creative){ G.hot[G.sel]={i:it,n:64}; G.nameT=1.8; SFX.pop() }
}
function dropItem(all){
 const s=selItem(); if(!s) return; const n=all?s.n:1; s.n-=n; if(!s.n) G.hot[G.sel]=null;
 let x=G.p.x+G.p.face.x*1.3, y=G.p.y+G.p.face.y*1.3; if(!canBe(x,y)){ x=G.p.x; y=G.p.y }
 G.drops.push({x,y,i:s.i,n,age:0}); SFX.jump();
}
function closeOverlays(){ ['#ovPause','#ovInv','#ovAdv'].forEach(s=>$(s).classList.add('hidden')); $('#chatBar').classList.add('hidden'); if(G){ G.overlay=null; G.invPick=null } }
function openOverlay(name){
 closeOverlays(); G.overlay=name; releaseMove();
 if(name==='pause') $('#ovPause').classList.remove('hidden');
 if(name==='inv'){ renderInv(); $('#ovInv').classList.remove('hidden'); unlock('bag') }
 if(name==='adv'){ renderAdv(); $('#ovAdv').classList.remove('hidden') }
 if(name==='chat'){ $('#chatBar').classList.remove('hidden') }
}
function releaseMove(){ ['KeyW','KeyA','KeyS','KeyD','Space','ShiftLeft','ControlLeft'].forEach(c=>{down.delete(c);keyVis(c,false)}); G.mb={0:false,1:false,2:false} }
function openChat(prefill){
 openOverlay('chat'); const i=$('#chatIn'); i.value=prefill||''; setTimeout(()=>{ i.focus(); i.setSelectionRange(i.value.length,i.value.length) },0);
}
function slotHTML(s,extra,num){ return `<div class="slot${extra||''}">${num?`<span class="num">${num}</span>`:''}${s?`<img src="${ICON[s.i]}" alt=""><b>${s.n>1?s.n:''}</b>`:''}</div>` }
function renderInv(){
 const pk=G.invPick;
 $('#invMain').innerHTML=G.inv.map((s,i)=>slotHTML(s,pk&&pk[0]==='inv'&&pk[1]===i?' pick':'').replace('class="slot','data-l="inv" data-i="'+i+'" class="slot')).join('');
 $('#invHot').innerHTML=G.hot.map((s,i)=>slotHTML(s,(i===G.sel?' sel':'')+(pk&&pk[0]==='hot'&&pk[1]===i?' pick':''),i+1).replace('class="slot','data-l="hot" data-i="'+i+'" class="slot')).join('');
 const off=$('#invOff'); off.dataset.l='off'; off.dataset.i='0'; off.className='slot'+(pk&&pk[0]==='off'?' pick':''); off.innerHTML=G.off?`<img src="${ICON[G.off.i]}" alt=""><b>${G.off.n>1?G.off.n:''}</b>`:'';
}
function slotRef(l,i){ return l==='inv'?[G.inv,i]:l==='hot'?[G.hot,i]:null }
$('#ovInv').addEventListener('mousedown',e=>{
 const el=e.target.closest('.slot[data-l]'); if(!el) return; e.preventDefault(); SFX.click();
 const cur=[el.dataset.l,+el.dataset.i];
 if(!G.invPick){ G.invPick=cur; renderInv(); return }
 const get=([l,i])=>l==='off'?G.off:slotRef(l,i)[0][i];
 const set=([l,i],v)=>{ if(l==='off') G.off=v; else slotRef(l,i)[0][i]=v };
 const a=get(G.invPick), b=get(cur); set(G.invPick,b); set(cur,a); G.invPick=null; renderInv();
});
$('#ovInv').addEventListener('contextmenu',e=>e.preventDefault());
function renderAdv(){ $('#advList').innerHTML=ADV.map(a=>`<div class="${G.adv[a[0]]?'got':''}"><span>${G.adv[a[0]]?a[1]:'🔒'}</span><div>${tr(a[2])}<small>${tr(a[3])}</small></div></div>`).join('') }
function showPlayers(){ if(G.overlay) return; $('#playersList').innerHTML=`<b>${U().players}</b><br>🟢 ${escapeHTML(playerName())} (${U().you})`; $('#ovPlayers').classList.remove('hidden') }
function hidePlayers(){ $('#ovPlayers').classList.add('hidden') }
function escapeHTML(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }
$('#bResume').onclick=()=>closeOverlays();
$('#bNew').onclick=()=>{ newGame(); };
$('#bGm').onclick=()=>{ G.creative=!G.creative; $('#bGm').textContent=G.creative?U().gmC:U().gmS; msg(G.creative?U().gmOnC:U().gmOnS,'#ffe066') };
$('#bAdvClose').onclick=()=>closeOverlays();

function lastKey(code,label,act,grp){
 $('#lastKey').innerHTML=`${U().lastKey} <kbd style="font:800 16px ui-rounded,system-ui;padding:2px 8px;border-radius:6px;border:1px solid var(--${grp||'muted'});border-bottom-width:3px;background:color-mix(in srgb,var(--${grp||'muted'}) 22%,var(--keybg))">${label}</kbd> ${act||''}`;
 $$('.wl').forEach(w=>w.classList.toggle('lit',w.dataset.k===code));
}
function worldKey(e,code,first){
 ensureGame();
 const a=ACT[code]; lastKey(code,keyName(code),a?a.emo+' '+tr(a.txt):'',a&&a.grp);
 if(code==='Escape'){ if(G.overlay) closeOverlays(); else openOverlay('pause'); return }
 if(code==='KeyE'&&first){ if(G.overlay==='inv') closeOverlays(); else if(!G.overlay) openOverlay('inv'); return }
 if(code==='KeyL'&&first){ if(G.overlay==='adv') closeOverlays(); else if(!G.overlay) openOverlay('adv'); return }
 if(G.overlay) return;
 if(!first) return;
 if(/^Digit[1-9]$/.test(code)){ selectSlot(+code.slice(5)-1); return }
 switch(code){
  case 'Space': if(G.p.jumpT<=0){ G.p.jumpT=.5; G.stats.jumps++; SFX.jump(); if(G.stats.jumps>=10) unlock('jump') } break;
  case 'KeyW': { const now=performance.now(); if(now-G.lastWTap<350) G.wSprint=true; G.lastWTap=now; break }
  case 'KeyQ': dropItem(e.ctrlKey); break;
  case 'KeyF': { const t=G.hot[G.sel]; G.hot[G.sel]=G.off; G.off=t; SFX.click(); break }
  case 'KeyT': openChat(''); break;
  case 'Slash': openChat('/'); break;
  case 'Tab': showPlayers(); break;
  case 'F1': G.hud=!G.hud; break;
  case 'F2': G.flash=1; toast(U().shot,'','📸'); SFX.click(); break;
  case 'F3': G.debug=!G.debug; if(G.debug) unlock('where'); break;
  case 'F5': G.zoomI=(G.zoomI+1)%3; toast(U().cam[G.zoomI],'','🎥'); break;
 }
}
$('#chatIn').addEventListener('keydown',e=>{
 e.stopPropagation();
 if(e.key==='Escape'){ e.preventDefault(); closeOverlays(); return }
 if(e.key==='Tab') e.preventDefault();
 if(e.key==='Enter'){ e.preventDefault(); const v=$('#chatIn').value.trim(); closeOverlays(); if(v) chatSend(v) }
});
function chatSend(v){
 if(v[0]!=='/'){ msg(`<${playerName()}> ${v}`); unlock('chat'); return }
 const c=v.toLowerCase().replace(/\s+/g,' ');
 const ok=t=>{ msg(t,'#ffe066'); unlock('cmd') };
 if(c==='/help'||c==='/?') msg(U().chatHelp,'#aaa');
 else if(c==='/time set day'||c==='/time set noon'){ G.night=false; ok(U().dayOn) }
 else if(c==='/time set night'||c==='/time set midnight'){ G.night=true; ok(U().nightOn) }
 else if(c==='/weather rain'||c==='/weather thunder'){ G.rain=true; ok(U().rainOn) }
 else if(c==='/weather clear'){ G.rain=false; ok(U().rainOff) }
 else if(/^\/gamemode (creative|c|1)$/.test(c)){ G.creative=true; $('#bGm').textContent=U().gmC; ok(U().gmOnC) }
 else if(/^\/gamemode (survival|s|0)$/.test(c)){ G.creative=false; $('#bGm').textContent=U().gmS; ok(U().gmOnS) }
 else msg(U().unknownCmd,'#ff8080');
}
cv.addEventListener('mousemove',e=>{ if(!G) return; const r=cv.getBoundingClientRect(); G.mouse={x:e.clientX-r.left,y:e.clientY-r.top} });
cv.addEventListener('mouseleave',()=>{ if(G) G.mouse=null });
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('mousedown',e=>{
 e.preventDefault(); ensureGame(); ac(); const r=cv.getBoundingClientRect(); G.mouse={x:e.clientX-r.left,y:e.clientY-r.top};
 if(G.overlay==='chat') closeOverlays();
 if(G.overlay) return;
 const b=e.button; G.mb[b]=true; lastKey('mouse'+b,'🖱️ '+tr(MNAME[b]||MNAME[0]),MOUSE[b]?MOUSE[b][0]+' '+tr(MOUSE[b][1]):'',MOUSE[b]&&MOUSE[b][2]);
 if(b===2){ placeBlock(); G.placeCD=.3 }
 if(b===1) pickBlock();
});
cv.addEventListener('wheel',e=>{
 e.preventDefault(); if(!G||G.overlay) return; const now=performance.now(); if(now-(G._wh||0)<90) return; G._wh=now;
 selectSlot(G.sel+(e.deltaY>0?1:-1)); lastKey('wheel','🖱️ 🔄',tr(MOUSE.wheel[1]),'view');
},{passive:false});

function update(dt){
 const p=G.p; G.time+=dt;
 if(G.overlay==='pause') return;
 let ix=0,iy=0;
 if(!G.overlay){ ix=(down.has('KeyD')?1:0)-(down.has('KeyA')?1:0); iy=(down.has('KeyS')?1:0)-(down.has('KeyW')?1:0) }
 p.sneak=!G.overlay&&down.has('ShiftLeft');
 p.sprint=(down.has('ControlLeft')||G.wSprint)&&iy<0&&!p.sneak&&(G.hunger>6||G.creative);
 p.inWater=cellAt(p.x,p.y)==='water';
 if(p.inWater) unlock('swim');
 let sp=p.sneak?1.3:p.sprint?5.6:4.3;
 if(p.inWater&&p.jumpT<=0) sp*=.45;
 if(ix||iy){
  const len=Math.hypot(ix,iy); p.face={x:ix/len,y:iy/len};
  const dx=ix/len*sp*dt, dy=iy/len*sp*dt; let moved=0;
  const ok=(nx,ny)=>{ if(!canBe(nx,ny)) return false; if(p.sneak&&!p.inWater&&cellAt(nx,ny)==='water'){ unlock('sneak'); return false } return true };
  if(ok(p.x+dx,p.y)){ p.x+=dx; moved+=Math.abs(dx) }
  if(ok(p.x,p.y+dy)){ p.y+=dy; moved+=Math.abs(dy) }
  p.walkT+=moved*3;
  if(p.sprint){ G.stats.run+=moved; if(G.stats.run>=30) unlock('run'); if(Math.random()<.4) G.parts.push({x:p.x,y:p.y+.3,vx:-p.face.x,vy:-p.face.y,life:.35,col:'rgba(220,220,220,.8)'}) }
  if(p.inWater&&Math.random()<.02) SFX.splash();
 }
 if(p.jumpT>0) p.jumpT-=dt;
 if(!G.creative){ G.hTimer+=dt*(p.sprint?3:1); if(G.hTimer>=30){ G.hTimer=0; if(G.hunger>0) G.hunger-- } }
 // mining
 const tg=target();
 if(G.mb[0]&&!G.overlay&&tg&&tg.reach&&BRK[tg.t]){
  if(G.mine.idx!==tg.idx){ G.mine={idx:tg.idx,prog:0,tick:0} }
  G.mine.prog+=dt/(G.creative?.12:BRK[tg.t]); G.mine.tick+=dt; if(G.mine.tick>.22){ G.mine.tick=0; SFX.tick() }
  if(G.mine.prog>=1){ breakCell(tg); G.mine={idx:-1,prog:0,tick:0} }
 } else G.mine={idx:-1,prog:0,tick:0};
 if(G.mb[2]&&!G.overlay){ G.placeCD-=dt; if(G.placeCD<=0){ placeBlock(); G.placeCD=.25 } }
 // drops
 for(let i=G.drops.length-1;i>=0;i--){ const d=G.drops[i]; d.age+=dt; if(d.age>1&&Math.hypot(d.x-p.x,d.y-p.y)<.8){ if(give(d.i,d.n)){ G.drops.splice(i,1); SFX.pop(); unlock('drop') } } }
 for(let i=G.parts.length-1;i>=0;i--){ const q=G.parts[i]; q.x+=q.vx*dt; q.y+=q.vy*dt; q.life-=dt; if(q.life<=0) G.parts.splice(i,1) }
 if(G.rain){ while(G.rainP.length<140) G.rainP.push({x:Math.random()*CW,y:Math.random()*CH,s:300+Math.random()*200}); G.rainP.forEach(r=>{ r.y+=r.s*dt; r.x-=40*dt; if(r.y>CH){ r.y=-10; r.x=Math.random()*(CW+40) } }) } else G.rainP.length=0;
 G.toasts.forEach(t=>t.t-=dt); G.toasts=G.toasts.filter(t=>t.t>0);
 if(G.nameT>0) G.nameT-=dt; if(G.flash>0) G.flash-=dt*2.5;
}

function drawPlayer(sx,sy,t){
 const p=G.p; let s=t*.95; if(p.sneak) s*=.86;
 const j=p.jumpT>0?Math.sin(Math.PI*(1-p.jumpT/.5)):0;
 ctx.fillStyle='rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(sx,sy+s*.28,s*.42*(1-j*.3),s*.18*(1-j*.3),0,0,Math.PI*2); ctx.fill();
 const by=sy-j*t*.4, sc=1+j*.12; s*=sc;
 const f=p.face, ang=Math.atan2(f.y,f.x)-Math.PI/2;
 ctx.save(); ctx.translate(sx,by); ctx.rotate(ang);
 const sw=Math.sin(p.walkT)*s*.12;
 ctx.fillStyle='#c79a6b'; ctx.fillRect(-s*.5,-s*.1+sw,s*.16,s*.3); ctx.fillRect(s*.34,-s*.1-sw,s*.16,s*.3);
 ctx.fillStyle=p.sneak?'#2d8a96':'#3fb6c4'; ctx.fillRect(-s*.36,-s*.18,s*.72,s*.36);
 ctx.fillStyle='#4a2f1a'; ctx.fillRect(-s*.26,-s*.26,s*.52,s*.52);
 ctx.fillStyle='#c79a6b'; ctx.fillRect(-s*.26,s*.1,s*.52,s*.16);
 ctx.fillStyle='#fff'; ctx.fillRect(-s*.18,s*.14,s*.1,s*.07); ctx.fillRect(s*.08,s*.14,s*.1,s*.07);
 ctx.fillStyle='#4b3aa0'; ctx.fillRect(-s*.13,s*.15,s*.05,s*.06); ctx.fillRect(s*.13,s*.15,s*.05,s*.06);
 const it=selItem(); if(it){ ctx.imageSmoothingEnabled=false; ctx.drawImage(TEX[it.i],s*.3,s*.12,s*.3,s*.3) }
 ctx.restore();
 if(p.inWater&&j<=0){ ctx.fillStyle='rgba(58,111,216,.55)'; ctx.fillRect(sx-s*.55,sy,s*1.1,s*.45) }
}
function drawHUD(){
 const sz=Math.min(46,Math.floor((CW-90)/10)), n=9, W=sz*n, x0=Math.round((CW-W)/2), y0=CH-sz-10;
 ctx.imageSmoothingEnabled=false;
 // offhand
 const ox=x0-sz-12;
 ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillRect(ox-3,y0-3,sz+6,sz+6);
 ctx.fillStyle='#8b8b8b'; ctx.fillRect(ox,y0,sz,sz); if(G.off){ ctx.drawImage(TEX[G.off.i],ox+sz*.18,y0+sz*.18,sz*.64,sz*.64); countTxt(G.off.n,ox+sz-3,y0+sz-3) }
 ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillRect(x0-3,y0-3,W+6,sz+6);
 for(let i=0;i<n;i++){ const x=x0+i*sz; ctx.fillStyle='#8b8b8b'; ctx.fillRect(x+1,y0+1,sz-2,sz-2); ctx.fillStyle='#6f6f6f'; ctx.fillRect(x+1,y0+sz-4,sz-2,3);
  const s=G.hot[i]; if(s){ ctx.drawImage(TEX[s.i],x+sz*.18,y0+sz*.18,sz*.64,sz*.64); countTxt(G.creative?'∞':s.n,x+sz-4,y0+sz-4) }
  ctx.fillStyle='rgba(255,255,255,.75)'; ctx.font=`800 ${Math.max(9,sz*.24)}px system-ui`; ctx.textAlign='left'; ctx.textBaseline='top'; ctx.fillText(String(i+1),x+3,y0+2) }
 const sx=x0+G.sel*sz; ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.strokeRect(sx-1.5,y0-1.5,sz+3,sz+3);
 if(!G.creative){
  ctx.font=`${Math.round(sz*.34)}px system-ui`; ctx.textBaseline='bottom';
  for(let i=0;i<10;i++){ ctx.globalAlpha=1; ctx.textAlign='left'; ctx.fillText('❤️',x0+i*sz*.44,y0-6) }
  for(let i=0;i<10;i++){ ctx.globalAlpha=(G.hunger>=(10-i)*2-1)?1:.22; ctx.textAlign='right'; ctx.fillText('🍗',x0+W-i*sz*.44,y0-6) }
  ctx.globalAlpha=1;
 }
 if(G.nameT>0&&selItem()){ ctx.globalAlpha=Math.min(1,G.nameT); ctx.font='800 16px system-ui'; ctx.textAlign='center'; ctx.textBaseline='bottom'; shadowTxt(tr(ITEM[selItem().i]),CW/2,y0-(G.creative?8:sz*.5+14)); ctx.globalAlpha=1 }
 if(G.creative){ ctx.font='800 14px system-ui'; ctx.textAlign='center'; ctx.textBaseline='top'; shadowTxt(U().creative,CW/2,8) }
}
function countTxt(n,x,y){ if(n===1) return; ctx.font='800 14px system-ui'; ctx.textAlign='right'; ctx.textBaseline='bottom'; shadowTxt(String(n),x,y) }
function shadowTxt(s,x,y){ ctx.fillStyle='#3f3f3f'; ctx.fillText(s,x+1.5,y+1.5); ctx.fillStyle='#fff'; ctx.fillText(s,x,y) }
function draw(){
 ctx.setTransform(DPR,0,0,DPR,0,0); ctx.imageSmoothingEnabled=false;
 const t=T(), p=G.p, ox=CW/2-p.x*t, oy=CH/2-p.y*t;
 ctx.fillStyle='#1b3a8a'; ctx.fillRect(0,0,CW,CH);
 const x0=Math.max(0,Math.floor(-ox/t)), x1=Math.min(G.C,Math.ceil((CW-ox)/t)), y0=Math.max(0,Math.floor(-oy/t)), y1=Math.min(G.R,Math.ceil((CH-oy)/t));
 const wf=(G.time*2|0)%2;
 for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++){
  const c=G.g[y*G.C+x], X=Math.floor(ox+x*t), Y=Math.floor(oy+y*t), S=Math.ceil(t)+1;
  if(c==='water') ctx.drawImage(TEX['water'+wf],X,Y,S,S);
  else if(c==='glass'){ ctx.drawImage(TEX.grass,X,Y,S,S); ctx.drawImage(TEX.glass,X,Y,S,S) }
  else ctx.drawImage(TEX[c],X,Y,S,S);
  if(!WALK[c]&&c!=='glass'){ ctx.fillStyle='rgba(0,0,0,.22)'; ctx.fillRect(X,Y+S-Math.max(2,t*.1),S,Math.max(2,t*.1)) }
 }
 ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=3; ctx.strokeRect(ox-1.5,oy-1.5,G.C*t+3,G.R*t+3);
 for(const d of G.drops){ const b=Math.sin(G.time*4+d.x)*t*.06; ctx.drawImage(TEX[d.i],ox+d.x*t-t*.2,oy+d.y*t-t*.2+b,t*.4,t*.4) }
 const tg=target();
 if(tg&&!G.overlay){
  ctx.strokeStyle=tg.reach?'rgba(0,0,0,.85)':'rgba(255,80,80,.5)'; ctx.lineWidth=2; ctx.strokeRect(ox+tg.tx*t+1,oy+tg.ty*t+1,t-2,t-2);
  if(G.mine.idx===tg.idx&&G.mine.prog>0){ const k=Math.min(9,Math.floor(G.mine.prog*10)); ctx.strokeStyle='rgba(0,0,0,.75)'; ctx.lineWidth=Math.max(1,t/16); ctx.beginPath(); const cx=ox+tg.tx*t+t/2, cy=oy+tg.ty*t+t/2; for(let i=0;i<=k;i++){ const a=i*2.4; ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*t*.45*(i/9+.3),cy+Math.sin(a)*t*.45*(i/9+.3)) } ctx.stroke() }
 }
 drawPlayer(CW/2,CH/2,t);
 for(const q of G.parts){ ctx.fillStyle=q.col; ctx.globalAlpha=Math.max(0,Math.min(1,q.life*2)); ctx.fillRect(ox+q.x*t-t*.05,oy+q.y*t-t*.05,t*.1,t*.1) } ctx.globalAlpha=1;
 if(G.rain){ ctx.strokeStyle='rgba(180,200,255,.55)'; ctx.lineWidth=1; ctx.beginPath(); G.rainP.forEach(r=>{ ctx.moveTo(r.x,r.y); ctx.lineTo(r.x-3,r.y+10) }); ctx.stroke(); ctx.fillStyle='rgba(40,50,80,.18)'; ctx.fillRect(0,0,CW,CH) }
 if(G.night){ ctx.fillStyle='rgba(8,14,50,.55)'; ctx.fillRect(0,0,CW,CH); const gr=ctx.createRadialGradient(CW/2,CH/2,10,CW/2,CH/2,t*4); gr.addColorStop(0,'rgba(255,220,150,.18)'); gr.addColorStop(1,'rgba(255,220,150,0)'); ctx.fillStyle=gr; ctx.fillRect(0,0,CW,CH) }
 if(G.hud){
  drawHUD();
  // chat log
  const now=performance.now(), open=G.overlay==='chat';
  const list=G.msgs.filter(m=>open||now-m.t<9000).slice(open?-10:-5);
  ctx.font='600 14px ui-monospace,Menlo,monospace'; ctx.textAlign='left'; ctx.textBaseline='top';
  let y=CH-(open?60:90)-list.length*20;
  for(const m of list){ const a=open?1:Math.max(0,Math.min(1,(9000-(now-m.t))/1000)); ctx.globalAlpha=a; const w=Math.min(CW-16,ctx.measureText(m.text).width+10); ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillRect(8,y,w,20); ctx.fillStyle=m.col; ctx.fillText(m.text,13,y+3,CW-26); y+=20 } ctx.globalAlpha=1;
  if(G.debug){
   const d=['north','east','south','west'], f=p.face, di=Math.abs(f.x)>Math.abs(f.y)?(f.x>0?1:3):(f.y>0?2:0);
   const lines=['Minecraft (trainer)',`XYZ: ${p.x.toFixed(2)} / 64 / ${p.y.toFixed(2)}`,`${U().dbgLook}: ${U().dirs[di]} (${d[di]})`,`${U().dbgBlock}: ${tg?tr(BLOCKNAME[tg.t]||ITEM[tg.t]||{en:tg.t}):'-'}`,`FPS: ${fps}`];
   ctx.font='600 14px ui-monospace,Menlo,monospace'; lines.forEach((l,i)=>{ const w=ctx.measureText(l).width+8; ctx.fillStyle='rgba(80,80,80,.6)'; ctx.fillRect(6,6+i*19,w,19); ctx.fillStyle='#fff'; ctx.fillText(l,10,8+i*19) });
  }
 }
 // toasts
 G.toasts.slice(-3).forEach((q,i)=>{ const w=Math.min(300,CW-20), x=CW-w-10, y=10+i*64, a=Math.min(1,q.t*2); ctx.globalAlpha=a; ctx.fillStyle='#212121'; ctx.fillRect(x,y,w,56); ctx.strokeStyle='#555'; ctx.lineWidth=2; ctx.strokeRect(x+1,y+1,w-2,54); ctx.font='28px system-ui'; ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillStyle='#fff'; ctx.fillText(q.icon||'',x+10,y+28); ctx.font='800 14px system-ui'; ctx.fillStyle='#ffe066'; ctx.fillText(q.title,x+50,y+(q.sub?19:28),w-60); if(q.sub){ ctx.fillStyle='#fff'; ctx.font='600 14px system-ui'; ctx.fillText(q.sub,x+50,y+38,w-60) } ctx.globalAlpha=1 });
 if(G.flash>0){ ctx.fillStyle=`rgba(255,255,255,${Math.min(1,G.flash)})`; ctx.fillRect(0,0,CW,CH) }
}

 requestAnimationFrame(loop);
}
